name: Build ASH Website Product Assets

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/library/originals/products/**'
      - 'scripts/process-product-assets.py'
      - '.github/workflows/product-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install pillow opencv-python-headless numpy

      - name: Build four final product assets
        run: python scripts/process-product-assets.py

      - name: Upload product review
        uses: actions/upload-artifact@v4
        with:
          name: ash-product-editorial-review
          path: public/assets/library/derived/products/product-editorial-review.jpg

      - name: Commit website assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/library/products public/assets/library/derived/products
          git commit -m 'Rebuild final ASH product assets with corrected processing' || echo 'No changes'
          git pull --rebase origin main
          git push
