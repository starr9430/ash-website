name: Optimize ASH Web Images

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/library/derived/ash-hero-scene-clean.png'
      - '.github/workflows/asset-optimize.yml'
  workflow_dispatch:

concurrency:
  group: ash-asset-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install pillow

      - name: Build web-ready bitmap assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          jobs = [
              (
                  Path('public/assets/library/derived/ash-hero-scene-clean.png'),
                  Path('public/assets/library/derived/ash-hero-scene-clean.webp'),
                  90,
              ),
          ]

          for src, dst, quality in jobs:
              if not src.exists():
                  if dst.exists():
                      print(f'Source already absent and WebP exists; treating {src} as already optimized.')
                      continue
                  raise SystemExit(f'Missing source asset and WebP output: {src}')

              with Image.open(src) as im:
                  original_mode = im.mode
                  original_size = im.size
                  if src.suffix.lower() == '.png' and 'A' in im.getbands():
                      out = im.convert('RGBA')
                  else:
                      out = im.convert('RGB')

                  out.save(dst, 'WEBP', quality=quality, method=6)

              web_size = dst.stat().st_size
              source_size = src.stat().st_size
              if out.size != original_size:
                  raise SystemExit(f'Dimension changed unexpectedly: {src}')
              if web_size >= source_size:
                  raise SystemExit(
                      f'WebP did not reduce size for {src}: '
                      f'{source_size} -> {web_size} bytes'
                  )

              print(
                  f'{src} | mode={original_mode} | dimensions={original_size} | '
                  f'source={source_size} bytes | webp={web_size} bytes'
              )
          PY

      - name: Switch production references to WebP
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/sections/Hero.jsx')
          text = path.read_text(encoding='utf-8')
          png = '/assets/library/derived/ash-hero-scene-clean.png'
          webp = '/assets/library/derived/ash-hero-scene-clean.webp'

          if png in text:
              path.write_text(text.replace(png, webp), encoding='utf-8')
              print('Switched Hero reference from PNG to WebP.')
          elif webp in text:
              print('Hero already references WebP; no reference change needed.')
          else:
              raise SystemExit('Hero contains neither the expected PNG nor WebP reference.')
          PY

      - name: Commit optimized assets and references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/library/derived/ash-hero-scene-clean.webp src/sections/Hero.jsx
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Convert active bitmap assets to WebP'
          git push origin HEAD:main
