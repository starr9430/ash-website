name: Verify ASH Website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'src/**'
      - 'public/assets/**'
      - 'public/images/**'
      - 'scripts/check.mjs'
      - 'scripts/check-assets.mjs'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'src/**'
      - 'public/assets/**'
      - 'public/images/**'
      - 'scripts/check.mjs'
      - 'scripts/check-assets.mjs'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Bootstrap dependency lockfile
        id: lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run static integrity check
        run: npm run check

      - name: Run production asset check
        run: npm run check-assets

      - name: Run production build
        run: npm run build

      - name: Commit bootstrapped lockfile
        if: github.event_name == 'push' && steps.lock.outputs.created == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Lock npm dependencies'
          git push origin HEAD:main
