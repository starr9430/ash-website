name: Verify ASH Website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'src/**'
      - 'public/assets/**'
      - 'public/images/**'
      - 'scripts/check.mjs'
      - 'scripts/check-assets.mjs'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'src/**'
      - 'public/assets/**'
      - 'public/images/**'
      - 'scripts/check.mjs'
      - 'scripts/check-assets.mjs'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ash-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Verification is intentionally read-only: it validates the current main state without pushing changes.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Bootstrap dependency lockfile
        id: lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run static integrity check
        run: npm run check

      - name: Run production asset check
        run: npm run check-assets

      - name: Run production build
        run: npm run build

      - name: Report missing lockfile
        if: github.event_name == 'push' && steps.lock.outputs.created == 'true'
        run: echo "::warning::package-lock.json was missing on main; the workflow generated one for this verification run but does not commit it."
