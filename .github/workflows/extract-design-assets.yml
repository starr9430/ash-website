name: Historical Design Asset Extraction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          pip install pillow opencv-python-headless numpy

      - name: Run historical extraction tool
        run: python tools/historical/extract-design-assets.py

      - name: Show generated files
        run: |
          git status --short
          git diff --stat
