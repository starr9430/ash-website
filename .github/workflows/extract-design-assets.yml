name: Extract ASH Design Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-design-assets.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image tools
        run: python -m pip install pillow opencv-python-headless
      - name: Generate final website artwork
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('public/assets/library/originals/website-reference/网站假想图1.png')
          out=Path('public/assets/library/derived')
          out.mkdir(parents=True, exist_ok=True)
          im=Image.open(src).convert('RGB')
          im.crop((500,78,1536,533)).save(out/'ash-hero-artwork.png', optimize=True)
          im2=Image.open('public/assets/library/originals/website-reference/网站假想图2.png').convert('RGB')
          im2.save(out/'ash-reference-layout-2.jpg', quality=95)
          im2.save(out/'ash-reference-layout-2.png', optimize=True)
          hero=im2.crop((0,78,1536,594)).copy()
          # Remove only the baked-in editorial text; preserve the continuous product/nature scene.
          import cv2, numpy as np
          arr=np.array(hero)
          bgr=cv2.cvtColor(arr, cv2.COLOR_RGB2BGR)
          masks=[
            (65,92,330,350),
            (1190,55,1470,180),
          ]
          mask=np.zeros(bgr.shape[:2],np.uint8)
          for xa,ya,xb,yb in masks:
            mask[ya:yb,xa:xb]=255
          bgr=cv2.inpaint(bgr,mask,9,cv2.INPAINT_TELEA)
          clean=Image.fromarray(cv2.cvtColor(bgr,cv2.COLOR_BGR2RGB))
          clean.save(out/'ash-hero-scene-clean.png', optimize=True)
          hero.crop((500,0,1536,516)).save(out/'ash-hero-artwork-2.png', optimize=True)
          im.crop((474,692,711,842)).save(out/'ash-product-cover-card.png', optimize=True)
          im.crop((723,692,956,842)).save(out/'ash-product-disc-card.png', optimize=True)
          im.crop((968,692,1201,842)).save(out/'ash-product-bearing-card.png', optimize=True)
          im.crop((1212,692,1446,842)).save(out/'ash-product-components-card.png', optimize=True)
          PY
      - name: Remove obsolete derived assets
        run: |
          rm -f public/assets/library/derived/ash-angled-clutch-reference.png
          rm -f public/assets/library/derived/ash-angled-clutch-source-crop.jpg
          rm -f public/assets/library/derived/hero-candidate-a.png
          rm -f public/assets/library/derived/hero-candidate-b.png
          rm -f public/assets/library/derived/hero-candidate-c.png
          rm -f public/assets/library/derived/hero-candidates-contact-sheet.jpg
      - name: Upload reference 2 for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ash-reference-2
          path: |
            public/assets/library/derived/ash-reference-layout-2.png
            public/assets/library/derived/ash-hero-artwork-2.png

      - name: Commit derived assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/assets/library/derived
          git commit -m 'Keep only final ASH website artwork assets' || echo 'No changes'
          git push