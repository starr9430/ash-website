name: Extract ASH Design Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-design-assets.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Generate reference crops
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path

          src = Path("public/assets/library/originals/website-reference/网站假想图1.png")
          out = Path("public/assets/library/derived")
          out.mkdir(parents=True, exist_ok=True)

          img = Image.open(src).convert("RGB")
          w, h = img.size

          crops = {
              "hero-candidate-a.png": (int(w*0.48), int(h*0.08), int(w*0.98), int(h*0.92)),
              "hero-candidate-b.png": (int(w*0.42), int(h*0.02), int(w*1.00), int(h*0.96)),
              "hero-candidate-c.png": (int(w*0.55), int(h*0.00), int(w*1.00), int(h*1.00)),
          }

          thumbs = []
          for name, box in crops.items():
              crop = img.crop(box)
              crop.save(out / name, optimize=True)
              thumb = ImageOps.contain(crop, (700, 520))
              canvas = Image.new("RGB", (720, 560), "white")
              canvas.paste(thumb, ((720-thumb.width)//2, 25))
              draw = ImageDraw.Draw(canvas)
              draw.text((20, 530), name, fill="black")
              thumbs.append(canvas)

          sheet = Image.new("RGB", (720*len(thumbs), 560), "#ece9e0")
          for i, thumb in enumerate(thumbs):
              sheet.paste(thumb, (i*720, 0))
          sheet.save(out / "hero-candidates-contact-sheet.jpg", quality=92)

          print("SOURCE", w, h)
          for k,v in crops.items():
              print(k, v)
          PY

      - name: Commit derived candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/library/derived
          git commit -m "Extract ASH hero reference candidates" || echo "No changes"
          git push

      - name: Upload reference material
        uses: actions/upload-artifact@v4
        with:
          name: ash-reference-material
          path: |
            public/assets/library/originals/website-reference/网站假想图1.png
            public/assets/library/derived/hero-candidates-contact-sheet.jpg
